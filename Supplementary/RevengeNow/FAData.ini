; sand tile set = used as sand, should have only one 1x1 tile
;                 can type tile set name in theater ini, like "GreenTile"
;                 -1 = do not generate sand tile
[AutoShoreTypes]
0=TEMPERATE,Sand Shorelines,ShorePieces,GreenTile
1=SNOW,Ice Shorelines,ShorePieces,GreenTile
2=URBAN,Grass Shorelines,ShorePieces,GreenTile
3=NEWURBAN,Sand Shorelines,ShorePieces,GreenTile
4=NEWURBAN,*Grass Dark Shorelines*,129,124
5=DESERT,Sand Shorelines,ShorePieces,GreenTile

; hacks for shore pieces
; shore id_pos=iswater
; pos: count from left top to right, then next "row"
; RA2 only needs one fix (for URBAN specifically)
[ShoreTerrainRA2]
12_4=1
12_5=1

; tilesets that may be modified using the shore or a similar logic
; 1 = affected, 0 = not affected
; in theater specific sections, format: tileIndex = 1/0
; [SoftTileSetsTEM]
[SoftTileSets]
ClearTile=1
RoughTile=1
ClearToRoughLat=1
SandTile=1
ClearToSandLat=1
GreenTile=1
ClearToGreenLat=1
PaveTile=1
MiscPaveTile=1
ClearToPaveLat=1
RoughGround=0; no
WaterSet=1
ShorePieces=1

[SoftTileSetsTEM]
81=0

