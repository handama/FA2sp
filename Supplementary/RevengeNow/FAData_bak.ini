153=控制存档按钮可用性,0,15,0,0,0,0,0,0,0,控制存档按钮是否为允许/禁止状态,0,1,153,1
154=设置参战方地图边界,0,6,0,0,0,0,0,0,0,设置参战方的地图边界，仅能为0-4之间的一个枚举值,0,1,154,1


