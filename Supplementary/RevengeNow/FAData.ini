25=越过水平线...,0,2,0,0,当特定作战方的一单位越过此触发事件特定的区域水平线时，事件触发。此触发事件必须放置于一个单元内。,0,1,25
26=越过垂直线...,0,2,0,0,当特定作战方的一单位越过此触发事件特定的区域垂直线时，事件触发。此触发事件必须放置于一个单元内。,0,1,26
