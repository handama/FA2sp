59=59 - 攻占路径点上的建筑,2,0,1,攻击占据该路径点的建筑物。AI单位通常会优先尝试驻扎（若能）。
60=60 - 进入回收厂,0,0,0,让小队进入该所属方就近的部队回收厂。
