35=敌人进入局部照明区...,0,0,0,0,当一个敌人单位进入关联建筑物投射的局部照明区时，事件触发。,0,1,35
36=局部开启...,0,3,0,0,当特定的局部变量开启(1)时，事件触发。,0,1,36
