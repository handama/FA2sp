32=建筑存在...,0,8,0,0,当此触发事件作战方有特定建筑存在于地图上时，事件触发。此建筑可以是以前就有的或由基地建造的。,0,1,32
33=被游戏者选定,0,2,0,0,当单位被游戏者选定时，事件触发。仅使用于单位任务中。,0,1,33
