; FAData.ini - Revenge Now (RN) Configured for FA2sp
; Includes RN custom sides, game modes, palettes, trigger actions, events, scripts, and templates

[Debug]
;DisplayAllOverlay=true ; Doesn't cripple the overlay list in any way
EnableTrackLogic=true ; Enables Track Logic
;IgnoreSHPImageHeadUnused=true ; Use this *carefully* to make SHP graphics of some mods work that incorrectly have the shadow flag set
AllowTunnels=true ; Enables tunnel editing

; Recursive inclusion is not supported

[Include]
0=FAData_RandomPlacement.ini
1=FAData_ObjectBrowser.ini
2=FAData_Customized.ini

[ExtConfigs]
; BOOLEAN ; Enables the redesigned ObjectBrowserView
; BOOLEAN ; 启用重构后的 ObjectBrowserView
BrowserRedraw=true					

; 0/1 ; Controls how FA2sp guesses a unit house: 0 (default) uses Prerequisite, 1 uses the first Owner
; 0/1 ; 决定 FA2sp 如何猜测单位的阵营, 0(默认)为Prerequisite,  1为第一个Owner
ObjectBrowser.GuessMode=0			

; INTERGER ; Maximum number of sides to guess; higher values return Other (-1). Default 15
; INTERGER ; 决定猜测阵营的最大值. 如果超过该值则返回为其他(-1), 默认为 15
ObjectBrowser.GuessMax=15			

; BOOLEAN ; Remove empty entries from house categories
; BOOLEAN ; 阵营分类会清除空项目
ObjectBrowser.CleanUp=true			

; BOOLEAN ; Hide houses that cannot be used
; BOOLEAN ; 决定 FA2sp 是否屏蔽掉不能使用的所属方
ObjectBrowser.SafeHouses=true		

; BOOLEAN ; Additionally group structures by foundation size
; BOOLEAN ; 是否会额外按照建筑大小进行分类
ObjectBrowser.Foundation=false			

; BOOLEAN ; Use random ore in placing
; BOOLEAN ; 是否在摆放矿石时随机图像
ObjectBrowser.Ore.RandomPlacement=false

; BOOLEAN ; Display extra two types of ores in "Ore and Gems"
; BOOLEAN ; 是否在“金矿和水晶”中支持额外矿石类型的摆放
ObjectBrowser.Ore.ExtraSupport=false

; BOOLEAN ; Load EditorCategory in rules into object viewer
; BOOLEAN ; 根据单位rules中的EditorCategory在对象查看器中分类
GridObjectViewer.LoadEditorCategory=true

; BOOLEAN ; Load ForceSides in rules into object viewer
; BOOLEAN ; 根据单位的ForceSides在对象查看器中分类
GridObjectViewer.LoadForceSides=true

; BOOLEAN ; Load smudges/terrains/overlays into object viewer based on their ObjectBrowser group
; BOOLEAN ; 根据污染/地形对象/覆盖物在物品浏览器中的分组在对象查看器中分类
GridObjectViewer.LoadObjectBrowserCategory=true 

; BOOLEAN ; Load the special civilian translation file (fa2civilian.csf)
; BOOLEAN ; 是否加载对平民单位/建筑的特殊翻译 (fa2civilian.csf)
LoadCivilianStringtable=true		

; BOOLEAN ; Reload supporting files from the map folder without reconfiguring FinalAlert.ini; default false
; BOOLEAN ; 是否从地图文件夹重新读取所有文件, 而不需要重新设置 FinalAlert.ini, 默认为 false
ReloadGameFromMapFolder=true

; BOOLEAN ; Reload game INIs when opening map file; default false
; BOOLEAN ; 是否在打开地图时重新加载游戏ini, 默认为 false
ReloadIniWhenOpeningMap=false	
	
; BOOLEAN ; Load game resources from map folder when directly open map; default false
; BOOLEAN ; 双击打开地图文件时，从地图目录加载资源文件, 默认为 false
LoadGameFromMapFolder.OnInit=false

; BOOLEAN ; Read #include sections to load additional INI files (not recommended)
; BOOLEAN ; 读取 #include 部分以获取其他 ini(不推荐)
AllowIncludes=true		

; BOOLEAN ; Load inherited INI sections (not recommended)
; BOOLEAN ; 读取继承的INI小节(不推荐)
AllowInherits=false	

; BOOLEAN ; section name of include (yes = $Include(Phobos), no = #include(Ares))
; BOOLEAN ; include小节的名称 (yes = $Include(Phobos), no = #include(Ares))
IncludeType=false

; BOOLEAN ; section name of inherit (yes = $Inherit(Phobos), no = []:[](Ares))
; BOOLEAN ; inherit小节的名称 (yes = $Inherit(Phobos), no = []:[](Ares))
InheritType=false

; BOOLEAN ; Allow the += syntax (not recommended)
; BOOLEAN ; 读取 += (不推荐)
AllowPlusEqual=true				

; BOOLEAN ; Read Image= from infantry, vehicle, and aircraft art(md)
; BOOLEAN ; 读取步兵, 车辆, 飞行器 art(md) 中的Image=
ArtImageSwap=false				

; BOOLEAN ; When enabled, selecting a CSF text argument opens the CSF browser
; BOOLEAN ; 启用此功能后, 当触发参数为CSF文本时, 点击下拉菜单会弹出CSF浏览器
TutorialTexts.Viewer=true	

; BOOLEAN ; Ask for confirmation when deleting sub-entries of triggers/scripts, etc.
; BOOLEAN ; 删除删除触发/脚本等的子条目时是否需要确认
ConfirmDelete.SubEntries=false

; BOOLEAN ; Clone triggers/teams/taskforces/scripts/AI triggers with an incrementing suffix instead of "Clone"
; BOOLEAN ; 启用此功能后, 复制触发、小队、特遣、脚本、AI触发时，都会在名称最后新增递增编号，而不是Clone
CloneWithOrderedID=true		

; BOOLEAN ; When creating new triggers/teams/taskforces/scripts/AI triggers, always use an incremented index (max + 1) instead of searching for the first available index
; BOOLEAN ; 启用此功能后, 创建触发、小队、特遣、脚本、AI触发时，会在当前最大ID后递增，而不是寻找第一个可用ID
UseSequentialIndexing=false	

; Independent suffixes (such as -TR for trigger) will be assigned when creating triggers, teams, taskforces, scripts, and AI triggers
; 启用此功能后, 创建触发、小队、特遣、脚本、AI触发时，会分配独立的后缀（如触发后缀为-TR）	
UseSeparateIndexing=false 

; BOOLEAN ; Automatically adjust dropdown widths
; BOOLEAN ; 启用后, FA2 将自动调整下拉菜单宽度
AdjustDropdownWidth=true			

; INTERGER ; Character width factor; default 8
; INTERGER ; 单个字符占用空间, 默认为8
AdjustDropdownWidth.Factor=6	

; INTERGER ; Maximum dropdown width; default 360
; INTERGER ; 下拉菜单的最大长度, 默认为360
AdjustDropdownWidth.Max=420		

; BOOLEAN ; Display the disabled status of the trigger in the dropdown menu of the trigger editor; default true
; BOOLEAN ; 在触发编辑器下拉菜单显示触发的禁止状态, 默认为 true
DisplayTriggerEnableInfo=true	

; BOOLEAN ; Check whether attached trigger is itself, default true
; BOOLEAN ; 检查下级触发是否是自身, 默认为 true
AttachedTriggerIsSelfCheck=true 	

; BOOLEAN ; Sort by name instead of ID in trigger/team/taskforce/script/terrain generator editors
; BOOLEAN ; 在触发编辑器、小队、特遣部队、动作脚本、地形生成器中, 是否依据名称而不是ID进行排序
SortByLabelName=true			

; BOOLEAN ; Override sorting for teams to use names instead of IDs
; BOOLEAN ; 在排序小队时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.Team=true		

; BOOLEAN ; Override sorting for scripts to use names instead of IDs
; BOOLEAN ; 在排序脚本时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.Script=true		

; BOOLEAN ; Override sorting for triggers to use names instead of IDs
; BOOLEAN ; 在排序触发时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.Trigger=true	

; BOOLEAN ; Override sorting for AI triggers to use names instead of IDs
; BOOLEAN ; 在排序AI触发时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.AITrigger=true	

; BOOLEAN ; Override sorting for taskforces to use names instead of IDs
; BOOLEAN ; 在排序特遣部队时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.Taskforce=true	

; BOOLEAN ; Override sorting for tags to use names instead of IDs
; BOOLEAN ; 在排序标签时, 是否依据名称而不是ID进行排序, 覆盖 SortByLabelName 设置
SortByLabelName.Tag=true

; BOOLEAN ; Disable automatic search for dropdown menus; search only when pressing Enter; default false
; BOOLEAN ; 是否禁止下拉菜单的自动搜索，若禁止，需要按Enter执行搜索, 默认为 false
SearchCombobox.Disabled=false	

; BOOLEAN ; Allow automatic search for non-parameter (trigger actiontype, eventtype, etc) dropdown menus; default true
; BOOLEAN ; 是否允许非参数项(触发事件、行为种类等)下拉菜单的自动搜索, 默认为 true
SearchCombobox.AllowNonParams=true	

; BOOLEAN ; Enable auto-search when entering waypoints; default false
; BOOLEAN ; 是否在下拉菜单中输入路径点时自动弹出搜索, 默认为 false
SearchCombobox.Waypoint=false	

; BOOLEAN ; Disable Lua console safety check; default false
; BOOLEAN ; 是否禁用Lua脚本安全检查, 默认为 false
DisableLuaConsoleSafetyCheck=false

; BOOLEAN ; Display real HP in techno dialogs; default true
; BOOLEAN ; 是否在单位属性窗口内显示真实血量, 默认为 true
DisplayRealHPinTechnoDlg=true

; COLORREF(R,G,B) ; Outline color when copying; default 255,0,0. Range 0-255
; COLORREF(R,G,B) ; 复制时描边的颜色, 默认为 255,0,0. 取值范围为0-255
CopySelectionBound.Color=255,0,0					

; COLORREF(R,G,B) ; Outline color for the hovered cell; default 60,160,60. Range 0-255
; COLORREF(R,G,B) ; 鼠标所指单元格的描边的颜色, 默认为 60,160,60. 取值范围为0-255
CursorSelectionBound.Color=30,30,255				

; COLORREF(R,G,B) ; Dashed height indicator color; default 60,60,60. Range 0-255
; COLORREF(R,G,B) ; 指示高度的虚线的颜色, 默认为 60,60,60. 取值范围为0-255
CursorSelectionBound.HeightIndicatorColor=60,60,160	

; BOOLEAN ; Adjust outline color by height level; default false
; BOOLEAN ; 是否根据当前高度显示不同的描边颜色, 默认为 false
CursorSelectionBound.AutoHeightColor=true					

; BOOLEAN ; Auto-detect encoding when opening INI and map files
; BOOLEAN ; 是否在打开ini和地图文件时自动推断编码, 默认为 true
UTF8Support.InferEncoding=true		

; BOOLEAN ; Always save maps using UTF-8 encoding
; BOOLEAN ; 是否总是以UTF8编码保存地图, 默认为 false
UTF8Support.AlwaysSaveAsUTF8=true	

; BOOLEAN ; Enable automatic map saves
; BOOLEAN ; 是否自动保存地图
SaveMap.AutoSave=true				

; INTEGER ; Interval between autosaves in seconds; must be >= 30, default 300
; INTEGER ; 应大于或等于30, 默认值为300, 决定两次自动保存间隔多少秒钟
SaveMap.AutoSave.Interval=360		

; INTEGER ; Number of backups to keep; -1 disables automatic cleanup. Default 10
; INTEGER ; 保存几个副本, 设置为-1将禁用自动删除备份功能, 默认为10
SaveMap.AutoSave.MaxCount=10		

; BOOLEAN ; Only save maps in .map format
; BOOLEAN ; 只以.map格式保存地图
SaveMap.OnlySaveMAP=false			

; Generate preview option when saving multiplayer maps. 0 create new, 1 reuse existing, 2 solid black. Default 0
; 保存多人游戏地图时生成预览的默认选项.0 生产新的预览, 1 使用已存在的, 2 使用纯黑预览. 默认为0
SaveMap.DefaultPreviewOptionMP=0	

; Same as above for singleplayer missions
; 同上, 单人战役
SaveMap.DefaultPreviewOptionSP=2	

; BOOLEAN ; Produce higher fidelity RA2-style previews when generating new previews (multiplayer only)
; BOOLEAN ; 选择生成新的预览时, 生成更精细的, 原版风格的预览图 (仅支持多人游戏)
SaveMap.BetterMapPreview=true		

; BOOLEAN ; Add an encoding warning comment at the top when saving maps
; BOOLEAN ; 保存地图时在开头添加编码警告注释
SaveMap.FileEncodingComment=true	

; BOOLEAN ; Keep existing comments when saving maps,  ini editor can also save and display comments
; BOOLEAN ; 保存地图时保留注释, ini编辑器也可以保存并显示注释
SaveMap.KeepComments=false

; BOOLEAN ; Preserve existing INI section order when saving maps
; BOOLEAN ; 保存地图时维持已有的 ini 小节顺序
SaveMap.PreserveINISorting=true

; BOOLEAN ; Adaptively sort INI keys when saving maps (natural numeric order for index sections, preserve order for properties)
; BOOLEAN ; 保存地图时维持键值自适应顺序（数字索引小节按数字自然升序，常规属性小节维持原序）
SaveMap.AdaptiveSorting=true

; Number of recent maps to remember; range 4-9
; 记录多少个最近打开地图, 取值范围为4-9
RecentFileLimit=9					

; BOOLEAN ; Enable unlimited waypoints; default false (requires Phobos)
; BOOLEAN ; 启用无限路径点, 默认为 false (需要Phobos)
ExtWaypoints=false				

; BOOLEAN ; Enable unlimited variables; default false (requires Phobos)
; BOOLEAN ; 启用无限变量, 默认为 false (需要Phobos)
ExtVariables=false				

; BOOLEAN ; Enable unlimited overlays; switches NewINIFormat to 5 when overlay index exceeds 255. Default false (requires Phobos)
; BOOLEAN ; 启用无限覆盖物, 当地图中覆盖物索引超过255时, 会自动将 NewINIFormat 切换为 5, 默认为 false (需要Phobos)
ExtOverlays=false				

; BOOLEAN ; Enable 32 facing directions; increases memory usage. Default false
; BOOLEAN ; 启用32向面向, 会导致内存占用增大, 默认为 false
ExtFacings=false					

; BOOLEAN ; Allow drag placement for 32 facings by holding Ctrl; otherwise 8 facings. Default false
; BOOLEAN ; 启用32向拖拽, 如果该值为 true, 则按住 ctrl 对单位进行拖拽可选32向, 否则为8向, 默认为 false
ExtFacings.Drag=false			

; BOOLEAN ; Show a live preview while dragging facings. Default true
; BOOLEAN ; 启用拖拽面向的实时预览, 默认为 true
ExtFacings.DragPreview=true		

; BOOLEAN ; Allow scroll units into 32 facings when placing; otherwise 8 facings. Default false
; BOOLEAN ; 启用32向的摆放时滚轮调整朝向, 否则为8向, 默认为 false
ExtFacings.Scroll=false

; BOOLEAN ; Allow vehicles and aircraft to tilt on slopes. Default false
; BOOLEAN ; 车辆和飞行器在斜坡上显示倾斜图像, 默认为 false
ExtTilts=false

; BOOLEAN ; Enable the new MIX loader to reduce memory leaks. Default true
; BOOLEAN ; 启用新的 Mix 加载器, 可以减少内存泄漏, 默认为 true
ExtMixLoader=true	

; BOOLEAN ; Load all in-map objects during map initialization to reduce lag during use. Default false
; BOOLEAN ; 在地图初始化时加载所有地图内对象, 可以减少使用中卡顿, 默认为 false
LoadObjectsOnInit=false		

; INTEGER ; Number of undo/redo steps; default 64
; INTEGER ; 可以进行多少次撤销/重做, 默认为64.
UndoRedoLimit=250				

; BOOLEAN ; Holding Shift while placing terrain counts as a single history entry. Default true
; BOOLEAN ; 如果该值为 true, 则按住shift放置地形时的变动仅记录一次历史记录, 撤销会全部撤销, 默认为 true
UndoRedo.ShiftPlaceTile=true	

; BOOLEAN ; Holding placement when drawing overlays counts as a single history entry. Default true
; BOOLEAN ; 如果该值为 true, 则长按放置覆盖图时的变动仅记录一次历史记录, 撤销会全部撤销, 默认为 true
UndoRedo.HoldPlaceOverlay=true	

; BOOLEAN ; Track history for game object edits. Default true
; BOOLEAN ; 如果该值为 true, 记录游戏对象的修改历史, 默认为 true
UndoRedo.RecordObjects=true		

; BOOLEAN ; Draw a rectangle background for waypoints. Default false
; BOOLEAN ; 为路径点绘制矩形背景, 默认为 false
Waypoint.Background=true			

; COLORREF(R,G,B) ; Waypoint background color. Range 0-255
; COLORREF(R,G,B) ; 路径点背景的颜色. 取值范围为0-255
Waypoint.Background.Color=0,0,255	

; COLORREF(R,G,B) ; Waypoint number color; default 0,0,255. Range 0-255
; COLORREF(R,G,B) ; 路径点数字的颜色, 默认为 0,0,255. 取值范围为0-255
Waypoint.Color=255,255,0			

; X,Y offset for waypoint text, default 0,0
; 路径点文本的X,Y坐标偏移值, 默认为 0,0.
Waypoint.Text.ExtraOffset=0,0	

; BOOLEAN ; Skip game directory validation (including ra2.mix). Default false
; BOOLEAN ; 禁用游戏目录检测, 启用后将不会检查游戏目录是否有效 (包括ra2.mix), 默认为 false
DisableDirectoryCheck=false		

; COLORREF(R,G,B) ; Base node index color. Range 0-255
; COLORREF(R,G,B) ; 基地节点索引号颜色. 取值范围为0-255
BaseNodeIndex.Color=255,255,0			

; BOOLEAN ; Draw a rectangle background for index numbers. Default false
; BOOLEAN ; 为索引号绘制矩形背景, 默认为 false
BaseNodeIndex.Background=true			

; COLORREF(R,G,B) ; Background color of basenode index. Range 0-255
; COLORREF(R,G,B) ; 基地节点索引的背景颜色. 取值范围为0-255
BaseNodeIndex.Background.Color=60,60,60	

; BOOLEAN ; Move the tile browser from bottom to right pane. Default false
; BOOLEAN ; 将地形浏览器从底部移至右侧, 默认为 false
VerticalLayout=true				

; BOOLEAN ; Display tile browser as a standalone window. Default false
; BOOLEAN ; 将地形浏览器作为独立窗口显示, 默认为 false
TileSetBrowserFloating=false

; BOOLEAN ; Display tile browser tabs in multiple rows to avoid horizontal scrolling. Default false
; BOOLEAN ; 地形浏览器标签页多行显示, 避免横向滚动, 默认为 false
TileSetBrowserMultiLineTabs=false

; BOOLEAN ; Display object browser as a standalone window. Default false
; BOOLEAN ; 将物品浏览器作为独立窗口显示, 默认为 false
ViewObjectsFloating=false

; BOOLEAN ; Enable dark theme. Default false
; BOOLEAN ; 启用暗色模式, 默认为 false
EnableDarkMode=false			

; BOOLEAN ; Dim the map view when dark theme is active. Default false
; BOOLEAN ; 启用暗色模式时, 将地图视图整体变暗, 默认为 false
EnableDarkMode.DimMap=false		

; BOOLEAN ; Follow the system dark theme setting; checked only at startup. Default true
; BOOLEAN ; FA2 将跟随系统暗色模式, 仅会在启动时检测, 不能实时切换, 默认为 true
AutoDarkMode=true				

; DOUBLE ; Scheduled dark theme start in 24-hour time; decimals allowed. Default -1
; DOUBLE ; 指定进入暗色模式的时间, 24小时制, 可以填小数, 默认为 -1
AutoDarkMode.StartTime=-1		

; DOUBLE ; Scheduled dark theme end in 24-hour time; decimals allowed. Default -1
; DOUBLE ; 指定离开暗色模式的时间, 24小时制, 可以填小数, 默认为 -1
AutoDarkMode.EndTime=-1		

; BOOLEAN ; Enable high-DPI awareness, Default true
; BOOLEAN ; 启用高DPI感知, 默认为 true
HiDPIAwareness=true

; BOOLEAN ; Match IsoView default zoom to system scaling when high-DPI awareness is enabled, Default false
; BOOLEAN ; 启用高 DPI 感知时，使地图视图默认匹配系统缩放比例, 默认为 true
HiDPIAwareness.ScaleIsoView=true

; COLORREF(R,G,B) ; Highlight color for multi-selection cells
; COLORREF(R,G,B) ; 多选单元格功能中选中块的颜色
MultiSelectionColor=255,47,255	

; FLOAT ; Opacity of the overlay color on multi-selected cells
; FLOAT ; 多选单元格附加颜色的透明度
MultiSelect.Opacity=0.33

; BOOLEAN ; Show all terrain objects in the random tree dialog. Default false
; BOOLEAN ; 在绘制随机树木对话框中显示所有地形对象, 默认为 false
RandomTerrainObjects=false	

; BOOLEAN ; Allocate DirectDraw surfaces in video memory. Default true
; BOOLEAN ; 决定 FA2 是否在显存中分配 DirectDraw surface, 默认为 true
DDrawInVideoMem=true			

; BOOLEAN ; Use emulation mode for DirectDrawCreate. Default false
; BOOLEAN ; 决定 FA2 是否在 DirectDrawCreate 中使用 emulation mode, 默认为 false
DDrawEmulation=false		

; BOOLEAN ; Support displaying IsoView on non-primary screens. Slight impact on performance. Default true
; BOOLEAN ; 是否支持在副屏上显示绘图界面, 对性能有轻微影响, 默认为 true
SecondScreenSupport=true	

; DOUBLE ; Maximum render zoom (only in DDraw mode), Default 1.5
; DOUBLE ; 绘图界面的最大缩放倍率 (仅DDraw模式有效), 默认为 1.5
DDrawScalingMaximum=1.5			

; BOOLEAN ; Use bilinear filtering when scaling the render surface. Improves quality at a performance cost. Default true
; BOOLEAN ; 使用双线性插值缩放绘图界面, 缩放质量更高, 但会影响性能, 默认为 true
DDrawScalingBilinear=true		

; BOOLEAN ; Only use bilinear filtering when zooming out. Default false
; BOOLEAN ; 仅在缩小界面时使用双线性插值, 默认为 false
DDrawScalingBilinear.OnlyShrink=false	

; BOOLEAN ; Draw map using graphics card, dramatically improve performance. Default true
; BOOLEAN ; 使用显卡加速绘图, 可以大幅提升性能, 默认为 true
DirectXRendering=true

; BOOLEAN ; Select graphics rendering API, true is OpenGL 3.3, false is Direct3D 11, default true
; BOOLEAN ; 选择显卡渲染API, true 为 OpenGL 3.3, false 为 Direct3D 11, 默认为 true
OpenGLRendering=true

; BOOLEAN ; Precisely calculate the depth relationship of game objects (slower). Default true
; BOOLEAN ; 精确计算游戏对象间的深度关系 (轻微影响性能), 默认为 true
PreciseDepthCalculation=true

; BOOLEAN ; Enable MCP server automatically when the Lua script console starts, allowing connection to LLMs. Default false
; BOOLEAN ; Lua 脚本终端开启时自动启用 MCP 服务器, 可以连接至大语言模型. 默认为 false
MCP.Enable=false

; INTEGER ; Port of MCP server. Default 19198
; INTEGER ; MCP 服务器的端口, 默认为 19198
MCP.Port=19198

; How to integrate (change 19198 to your custom MCP.Port):
; 集成方式 (将19198替换为你自定义的MCP.Port):
;{
;  "mcpServers": {
;    "FA2spHE (RA2 map editor)": {
;      "url": "http://localhost:19198"
;    }
;  }
;}

; BOOLEAN ; Do not translate houses to their UIName. Default false
; BOOLEAN ; 决定 FA2 是否*不*将所属方翻译为其 UIName, 默认为 false
NoHouseNameTranslation=false	

; BOOLEAN ; After translation, also display the English house name. Requires NoHouseNameTranslation to be false. Default false
; BOOLEAN ; 决定 FA2 是否在所属方翻译后显示英文原名, 需要关闭NoHouseNameTranslation, 默认为 false
BetterHouseNameTranslation=true	

; BOOLEAN ; Show warnings instead of errors for new map validation checks. Default false
; BOOLEAN ; 如果该值为 true, 则检查地图的新功能不会显示错误, 而是显示警告, 默认为 false
ExtendedValidationNoError=false

; BOOLEAN ; Use a 512 value when checking map INI lengths (128 for Vanilla). Default false
; BOOLEAN ; 如果该值为 true, 则检查地图INI长度时会取512, 而不是原版的128, 默认为 false
ExtendedValidationAres=false	

; BOOLEAN ; Do not render structures with HP = 0 and LeaveRubble=no. Default false
; BOOLEAN ; 如果该值为 true, 则不会渲染 HP = 0 且带有 LeaveRubble=no 的建筑, 默认为 false
HideNoRubbleBuilding=false		

; BOOLEAN ; Enforce strict NewTheater logic; structures without art are hidden. Default false
; BOOLEAN ; 如果该值为 true, 则启用严格 NewTheater 逻辑, 未找到对应图像的建筑将不会显示, 默认为 false
UseStrictNewTheater=true		

; INTEGER ; Choose logic for reading the second art letter: 0 = Vanilla (G,N,C,Y), 1 = Ares (any letter). Default 1
; INTEGER ; 设置读取建筑图像第二位字母的逻辑, 0 = 尤复逻辑(G, N, C, Y开头), 1 = Ares逻辑(任意字母开头), 默认为 1
NewTheaterType=1				

; BOOLEAN ; Prevent placing overlapping structures; ignores StructureOverlappingCheckIgnores entries. Default false
; BOOLEAN ; 如果该值为 true, 则不能摆放重叠建筑, 忽略StructureOverlappingCheckIgnores中的建筑, 默认为 false
PlaceStructure.OverlappingCheck=true	

; BOOLEAN ; Auto-fill the Upgrade count. Default false
; BOOLEAN ; 如果该值为 true, 则自动填写Upgrade数量, 默认为 false
PlaceStructure.AutoUpgrade=true			

; BOOLEAN ; Apply full health when an Upgrade is present to match in-game behavior. Default false
; BOOLEAN ; 如果该值为 true, 建筑存在Upgrade时, 自动将血量设置为满血, 符合游戏内表现, 默认为 false
PlaceStructure.UpgradeStrength=true		

; BOOLEAN ; Upgrades can be directly placed onto buildings. Default false
; BOOLEAN ; 如果该值为 true, 可以直接向建筑放置加载物, 默认为 false
PlaceStructure.PlaceUpgrade=true

; BOOLEAN ; When "Default Lighting" is selected, adjust unit RGB values. Default false
; BOOLEAN ; 选择光照沙盒的"默认光照"时, 是否调整建筑, 步兵, 载具, 飞行器的RGB值. 默认为 false
LightingPreview.MultUnitColor=false		

; BOOLEAN ; Tint the tileset browser using the lighting sandbox settings. Default false
; BOOLEAN ; 是否按照光照沙盒的光照重新渲染地形浏览器图像. 默认为 false
LightingPreview.TintTileSetBrowserView=true	

; BOOLEAN ; Make the arrangement of images in tileset browser more compact. 默认为 true
; BOOLEAN ; 紧凑排列地形浏览器的图像. 默认为 true
TileSetBrowserViewCompactArrange=true

; BOOLEAN ; Display the localsize border (blue outline) on the minimap. Default false
; BOOLEAN ; 在小地图中显示可视地图边界(蓝色边框). 默认为 false
ShowMapBoundInMiniMap=false				

; BOOLEAN ; Place the first infantry in subcell 4 (bottom) like the game. Default false
; BOOLEAN ; 如果该值为 true, 单元格中第一个放置的步兵位于最下方，即4号subcell, 默认为 false
InfantrySubCell.GameDefault=true		

; BOOLEAN ; Select infantry by cursor position within the cell instead of cycling all. Default false
; BOOLEAN ; 如果该值为 true, 在编辑步兵时会根据鼠标在单元格中的相对位置选择步兵, 而不是遍历全部, 默认为 false
InfantrySubCell.Edit=true				

; BOOLEAN ; When only one infantry in a cell, still honor cursor position. Default false selects the only infantry regardless of cursor position
; BOOLEAN ; 如果该值为 true, 当单元格内只有一个步兵时, 仍然会判断鼠标的相对位置, false 时会始终选取该步兵, 默认为 false
InfantrySubCell.Edit.Single=false		

; BOOLEAN ; When dragging infantry, place them based on cursor position. Default false
; BOOLEAN ; 如果该值为 true, 在拖拽步兵时，会考虑鼠标的相对位置放置, 默认为 false
InfantrySubCell.Edit.Drag=true			

; BOOLEAN ; When placing infantry, place them based on cursor position. Default false
; BOOLEAN ; 如果该值为 true, 在放置步兵时，会考虑鼠标的相对位置放置, 默认为 false
InfantrySubCell.Edit.Place=true			

; BOOLEAN ; Lock infantry in the center to match InfantrySubCell.GameDefault, otherwise depend on cursor position. Default false
; BOOLEAN ; 如果该值为 true, 会固定单元格中间步兵的位置同 InfantrySubCell.GameDefault 一致, 否则根据鼠标上下位置决定. 默认为 false
InfantrySubCell.Edit.FixCenter=false	

; BOOLEAN ; Consider OccupationBits of terrain objects when placing infantry. Default false
; BOOLEAN ; 如果该值为 true, 在放置步兵时会考虑地形对象对单元格的占用, 默认为 false
InfantrySubCell.OccupationBits=true		

; STRING ; Default infantry parameterss matching the INI section
; STRING ; 摆放步兵的默认参数, 顺序与INI小节一致
DefaultInfantryProperty=House,ID,256,X,Y,Subcell,Guard,64,None,0,-1,0,0,0    

; STRING ; Default vehicle parameterss matching the INI section
; STRING ; 摆放车辆的默认参数, 顺序与INI小节一致
DefaultUnitProperty=House,ID,256,X,Y,64,Guard,None,0,-1,0,-1,0,0             

; STRING ; Default aircraft parameterss matching the INI section
; STRING ; 摆放飞行器的默认参数, 顺序与INI小节一致
DefaultAircraftProperty=House,ID,256,X,Y,64,Guard,None,0,-1,0,0              

; STRING ; Default buildiing parameterss matching the INI section
; STRING ; 摆放建筑的默认参数, 顺序与INI小节一致
DefaultBuildingProperty=House,ID,256,X,Y,0,None,0,0,1,0,0,None,None,None,1,0 

; STRING ; Supported associable map file formats
; STRING ; 支持关联的地图文件格式
SupportedFormats=map,mpr,yrm,mmx,yro

; BOOLEAN ; Force CString allocations on the stack for stability at minor perf cost. Default true
; BOOLEAN ; 强制CString内存在堆上分配, 可以提升稳定性, 但可能轻微降低效率, 默认为 true
StringBufferStackAllocation=true

; BOOLEAN ; Use a stricter exception filter that catches C++ EH exceptions. Default false
; BOOLEAN ; 启用更严格的错误捕获, 会捕获 C++ EH exception, 默认为 false
StrictExceptionFilter=false		

; BOOLEAN ; Use the modern toolbar cameos. Default true
; BOOLEAN ; 是否使用新的工具栏图标, 默认为 true
UseNewToolBarCameo=true			

; BOOLEAN ; Skip the tips of the day dialog. Default false
; BOOLEAN ; 是否不显示今日提示窗口，默认为 false
SkipTipsOfTheDay=false			

; BOOLEAN ; Prevent brush tools (raise/lower/flatten) from changing brush size automatically. Default false
; BOOLEAN ; 在选择地形工具(抬升、降低、平整地形)时, 是否跳过改变笔刷大小, 默认为 false
SkipBrushSizeChangeOnTools=true	

; BOOLEAN ; Remember brush sizes for mouse commands and restore them when switching. Default false
; BOOLEAN ; 记忆各操作的笔刷大小，并在切换时自动还原, 默认为 false
RecordBrushSizeHistory=false

; BOOLEAN ; When placing tiles, skip hidden cells. Default false
; BOOLEAN ; 在放置地形、生成海岸、抬升地表、粘贴地形时, 是否跳过被隐藏的单元格, 默认为 false
PlaceTileSkipHide=true	

; BOOLEAN ; Enable Veinhole Monster logic to display corresponding overlays in the object browser and terrain browser. Default false
; BOOLEAN ; 启用泰伯利亚藤蔓（蔓孔）逻辑, 在物品浏览器、地形浏览器中显示对应的覆盖物, 默认为 false
EnableVeinholeLogic=false	

; BOOLEAN ; Hide team/taskforce/script sections in the INI editor. Default false
; BOOLEAN ; 在INI编辑器中, 是否忽略小队、特遣、脚本小节, 默认为 false
INIEditor.IgnoreTeams=true		

; BOOLEAN ; When holding Ctrl for fill, treat LAT tiles as the same group. Default true
; BOOLEAN ; 按住ctrl填充地形时, 是否同时填充目标地形的LAT, 默认为 true
FillArea.ConsiderLAT=true		

; BOOLEAN ; When holding Ctrl for fill, treat all water tiles as as the same group. Default true
; BOOLEAN ; 按住ctrl填充地形时, 将所有水面视为一类, 默认为 true
FillArea.ConsiderWater=true		

; BOOLEAN ; When holding Ctrl for fill, treat sub tile blocks as as the same group. Default true
; BOOLEAN ; 按住ctrl填充地形时, 将整个地形的子地形块视作一类, 默认为 true
FillArea.ConsiderWholeTile=true		

; BOOLEAN ; Render object shadows in the map view. Default true
; BOOLEAN ; 是否显示所有游戏对象的阴影, 开启时可以在图层中手动关闭, 默认为 true
InGameDisplay.Shadow=true		

; BOOLEAN ; Display voxel shadow on the ground instead of in the bottom. Default false
; BOOLEAN ; 在地面上而不是体素的最底部渲染阴影, 默认为 false
InGameDisplay.Shadow.OnGround=false	

; BOOLEAN ; Show deploy/unload images of units. Default true
; BOOLEAN ; 是否对可部署的Unload状态的单位显示部署图像, 不会考虑发生了单位转换的单位, 默认为 true
InGameDisplay.Deploy=true		

; BOOLEAN ; Draw water images of units in water. Default true
; BOOLEAN ; 是否对水中的步兵或载具显示水中图像, 不会考虑发生了单位转换的单位, 默认为 true
InGameDisplay.Water=true		

; BOOLEAN ; Support Phobos damaged art images. Default true
; BOOLEAN ; 是否支持 Phobos 的单位伤残更换图像功能, 默认为 true
InGameDisplay.Damage=true		

; BOOLEAN ; Render hover unit a little higher. Default true
; BOOLEAN ; 是否将悬浮单位渲染的更高一些, 默认为 true
InGameDisplay.Hover=true		

; BOOLEAN ; Display alphaimages for terrain objects and buildings; can disable manually if needed. Default true
; BOOLEAN ; 是否显示建筑物和地形对象的 AlphaImage, 开启时可以在图层中手动关闭, 默认为 true
InGameDisplay.AlphaImage=true	

; BOOLEAN ; Render "OnBridge" unit a little higher. Default true
; BOOLEAN ; 是否将“在桥梁上”的单位渲染的更高一些, 默认为 true
InGameDisplay.Bridge=true		

; BOOLEAN ; Respect animation offsets in art when rendering. Default true
; BOOLEAN ; 是否根据素材与 art 设置调整建筑动画图层, 在少数情况下可能与游戏内不一致, 默认为 true
InGameDisplay.AnimAdjust=true	

; BOOLEAN ; Show cloaked units as transparent. Default false
; BOOLEAN ; 隐形单位是否半透明显示, 默认为 false
InGameDisplay.Cloakable=false	

; BOOLEAN ; Display remapble colors of wall overlays by nearest building. Default false
; BOOLEAN ; 根据距离最近的建筑, 显示围墙覆盖物的所属色, 默认为 false
InGameDisplay.RemapableOverlay=false

; BOOLEAN ; Display invisible bridge overlays in numbers. Default false
; BOOLEAN ; 以数字显示不可见的桥梁覆盖物	, 默认为 false
DisplayBridgeOverlay=false

; BOOLEAN ; Display default images for vehicles, infantry, and aircraft without images, names are: FA2DEFAULT_AIRCRAFT, FA2DEFAULT_INFANTRY, FA2DEFAULT_UNIT. Default false
; BOOLEAN ; 为没有图像的车辆、步兵与飞行器显示缺省图像, 名称为: FA2DEFAULT_AIRCRAFT, FA2DEFAULT_INFANTRY, FA2DEFAULT_UNIT, 默认为 false
UseDefaultUnitImage=true

; BOOLEAN ; Display default images for techno attachments without images. Default false
; BOOLEAN ; 为没有图像的附加单位显示缺省图像, 默认为 false
UseDefaultUnitImage.TechnoAttachment=false

; FLOAT ; Voxel light vector as X,Y,Z corresponding to game. Positive numbers are illuminated from the direction of the axis(↖, ↗, ↓). Default 0.05,1,0.2
; FLOAT ; VXL渲染的光源方向, 格式为 X,Y,Z, 正数为从数轴方向照射(↖, ↗, ↓), 默认为 0.05,1,0.2
LightingSource=0.05,1,0.2	

; INTERGER ; Maximum value of overlay data. Default 60
; INTERGER ; 覆盖物数据的最大值, 默认为 60
OverlayDataLimit=256	

; BOOLEAN ; Hide ExtraImage when Flat To Ground Mode enabled. Default false
; BOOLEAN ; 开启平面显示时, 是否隐藏地形的 ExtraImage, 默认为 false
FlatToGroundHideExtra=false		

; BOOLEAN ; Render objects outside of map bounds. Default false
; BOOLEAN ; 是否显示地图边界外的游戏对象, 默认为 false
DisplayObjectsOutside=false		

; BOOLEAN ; Show <Player @ A-H> options for technos (Phobos). Default false
; BOOLEAN ; 科技类型窗口在多人地图中显示 Phobos 支持的 <Player @ A-H> 所属方, 默认为 false
PlayerAtXForTechnos=false		

; BOOLEAN ; Show <Player @ A-H> options for triggers (Phobos). Default false
; BOOLEAN ; 触发编辑器窗口在多人地图中显示 Phobos 支持的 <Player @ A-H> 所属方, 默认为 false
PlayerAtXForTriggers=false		

; BOOLEAN ; Monitor map files for external edits. Default true
; BOOLEAN ; 检测地图文件是否被外部修改. 默认为 true
FileWatcher=true				

; INTERGER ; Number of distance ruler history entries. Default 5
; INTERGER ; 距离标尺记录的历史数量, 默认为 5
DistanceRuler.Records=5					

; INTERGER ; Font size for money on map and property viewer. Default 18
; INTERGER ; 资源总量与属性查看字体的大小, 默认为 18
DisplayTextSize=18							

; INTERGER ; Tree view cameo size; default 32 (min 16, max 64)
; INTERGER ; 物品浏览器图标的大小, 默认为 32, 最小 16, 最大 64
TreeViewCameo.Size=32		

; BOOLEAN ; Whether or not draw celltag icons translucently. Default false
; BOOLEAN ; 是否半透明绘制单元标记图标. 默认为 false
DrawCelltagTranslucent=true		

; BOOLEAN ; Whether or not force Neutral and Special houses to use the light gray color in skirmish. Default true
; BOOLEAN ; 是否在多人地图中, 强制 Neutral 和 Special 所属方使用浅灰色颜色. 默认为 true
ForceNeutralSpecialColor=true	

; BOOLEAN ; Map house color variants to their corresponding solid colors. Default false
; BOOLEAN ; 将单位所属色变体映射为纯色. 默认为 false
UnifyHouseColors=false

; COLORREF(R,G,B) ; Color in waypoint flag to be replaced in "Set waypoint color". Default 0,255,0. Range 0-255
; COLORREF(R,G,B) ; 在“设置路径点颜色”中替换的路径点旗帜颜色, 默认为 0,255,0. 取值范围为0-255
DisplayColor.Waypoint=0,255,0

; COLORREF(R,G,B) ; Color in celltag icon to be replaced in "Set celltag color". Default 255,0,0. Range 0-255
; COLORREF(R,G,B) ; 在“设置单元标记颜色”中替换的单元标记图标颜色, 默认为 255,0,0. 取值范围为0-255
DisplayColor.Celltag=255,0,0

; COLORREF(R,G,B) ; Distance ruler color. Default 255,0,0. Range 0-255
; COLORREF(R,G,B) ; 距离标尺线段的颜色, 默认为 255,0,0. 取值范围为0-255
DistanceRuler.Color=255,0,0				

; COLORREF(R,G,B) ; Boundary color for terrain generator. Default 255,255,0. Range 0-255
; COLORREF(R,G,B) ; 地形生成器设置范围的颜色, 默认为 255,255,0. 取值范围为0-255
TerrainGeneratorColor=255,255,0			

; COLORREF(R,G,B) ; Player posistion indicator color for map renderer. Default 255,0,0. Range 0-255
; COLORREF(R,G,B) ; 地图渲染器游戏者位置的颜色, 默认为 255,0,0. 取值范围为0-255
PlayerLocation.Color=255,0,0		 		

; INTEGER ; Maximum distance displayed by range overlays; very large values reduce performance. Default 50
; INTEGER ; 范围属性最大显示的距离, 过大的范围会导致显示卡顿, 默认为50
RangeBound.MaxRange=50						

; COLORREF(R,G,B) ; Primary weapon range color. Default 0,255,255. Range 0-255
; COLORREF(R,G,B) ; 主武器射程范围的颜色, 默认为 0,255,255. 取值范围为0-255
WeaponRangeBound.Color=0,255,255			

; COLORREF(R,G,B) ; Primary minimum range color. Default 0,200,200. Range 0-255
; COLORREF(R,G,B) ; 主武器最小射程范围的颜色, 默认为 0,200,200. 取值范围为0-255
WeaponRangeMinimumBound.Color=0,200,200	

; COLORREF(R,G,B) ; Secondary weapon range color. Default 0,255,130. Range 0-255
; COLORREF(R,G,B) ; 副武器射程范围的颜色, 默认为 0,255,130. 取值范围为0-255
SecondaryWeaponRangeBound.Color=0,255,130			

; COLORREF(R,G,B) ; Secondary minimum range color. Default 0,200,100. Range 0-255
; COLORREF(R,G,B) ; 副武器最小射程范围的颜色, 默认为 0,200,100. 取值范围为0-255
SecondaryWeaponRangeMinimumBound.Color=0,200,100	

; COLORREF(R,G,B) ; Death weapon range color. Default 255,127,39. Range 0-255
; COLORREF(R,G,B) ; 自杀武器范围的颜色, 默认为 255,127,39. 取值范围为0-255
DeathWeaponRangeBound.Color=255,127,39		

; COLORREF(R,G,B) ; Gap generator range color. Default 0,0,255. Range 0-255
; COLORREF(R,G,B) ; 黑幕产生范围的颜色, 默认为 0,0,255. 取值范围为0-255
GapRangeBound.Color=0,0,255				

; COLORREF(R,G,B) ; Sensor array range color. Default 255,0,255. Range 0-255
; COLORREF(R,G,B) ; 隐形检测范围的颜色, 默认为 255,0,255. 取值范围为0-255
SensorsRangeBound.Color=255,0,255			

; COLORREF(R,G,B) ; Cloak generator range color. Default 255,0,0. Range 0-255
; COLORREF(R,G,B) ; 隐形范围的颜色, 默认为 255,0,0. 取值范围为0-255
CloakRangeBound.Color=255,0,0				

; COLORREF(R,G,B) ; Psychic sensor range color. Default 255,255,0. Range 0-255
; COLORREF(R,G,B) ; 心灵感应范围的颜色, 默认为 255,255,0. 取值范围为0-255
PsychicRangeBound.Color=255,255,0			

; COLORREF(R,G,B) ; Guard area range color. Default 0,255,0. Range 0-255
; COLORREF(R,G,B) ; 区域警戒范围的颜色, 默认为 0,255,0. 取值范围为0-255
GuardRangeBound.Color=0,255,0				

; COLORREF(R,G,B) ; Sight range color. Default 128,128,128. Range 0-255
; COLORREF(R,G,B) ; 视野范围的颜色, 默认为 128,128,128. 取值范围为0-255
SightRangeBound.Color=128,128,128		

; COLORREF(R,G,B) ; Designator range color. Default 128,128,128. Range 0-255
; COLORREF(R,G,B) ; 指示者范围的颜色, 默认为 34,177,76. 取值范围为0-255
DesignatorRangeBound.Color=34,177,76

; COLORREF(R,G,B) ; Inhibitor range color. Default 128,128,128. Range 0-255
; COLORREF(R,G,B) ; 抑制者范围的颜色, 默认为 204,46,49. 取值范围为0-255
InhibitorRangeBound.Color=204,46,49
	
; BOOLEAN ; Apply elevation modifiers to weapon range preview; low accuracy. Default false
; BOOLEAN ; 计算武器射程时，是否考虑高度对射程的影响, 精确度较低, 仅供参考, 默认为 false
WeaponRangeBound.SubjectToElevation=true		

; BOOLEAN ; Draw all ranges except for weapons subject to elevation using ellipses. Default true
; BOOLEAN ; 使用椭圆绘制除了受高度影响的武器外的所有范围, 默认为 false
RangeBound.DrawEllipse=true	

; BOOLEAN ; Show outlines by default when pasting. Default false
; BOOLEAN ; 粘贴地形时, 是否默认显示描边, 默认为 false
PasteShowOutline=true						

; Mix overrides, yes = relative path to FA2 installed folder
; Can be used to override game content to show in FA2
; First one has highest loading priority
;[ExtraMixes]

; Encrypted packages, yes = relative path to FA2 installed folder
; Can be used to override game content to show in FA2
; First one has highest loading priority
; How to use, please refer to documentation 
;[ExtraPackages]
;data.rpck=false

; Custom resource directories, read in registration order
; Value: yes/true = relative path to FA2 installed folder, no/false = relative path to game folder
; Can be used to override game content to show in FA2
; First one has highest loading priority
; Priority: lower than Resources\HighPriority\, higher than the game path
;[ExtraDirectories]
;voxels=false

; Stringtable overrides, yes = relative path to FA2 installed folder
; Can be used to override stringtables to show in FA2
; Support .csf, .llf, .ecs, and .ini (exported by Ra2CsfToolsGUI)
