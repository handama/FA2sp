name: MSBuild

on:
  # Build + test on every push to master so each commit gets a downloadable
  # FA2sp_Release_<sha> artifact (the reusable-workflow refactor had dropped this).
  push:
    branches:
      - "master"
    paths-ignore:
      - 'image/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'image/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/reusable-build-and-test.yml
    with:
      configuration: Release
      run_tests: true