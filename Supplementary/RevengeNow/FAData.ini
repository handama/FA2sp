60=60 - 进入回收厂,0,0,0,让小队进入该所属方就近的部队回收厂。
61=61 - 进入坦克碉堡,0,0,0,让小队的每个单位进入空的坦克碉堡。
62=62 - 进入生化反应炉,0,0,0,让小队进入生化反应炉。
63=63 - 进入战斗碉堡,0,0,0,让小队进入战斗碉堡。
64=64 - 进入可驻军建筑,0,0,0,让小队进驻中立建筑物。
