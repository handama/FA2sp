54=间谍伪装步兵进入（无用）...,0,10,0,0,当间谍伪装为特定步兵类单位进入时，事件触发。,0,0,54
55=被摧毁%1 单位%1 海军...,0,2,0,0,当特定作战方的所有海军单位被摧毁时，事件触发。典型应用于游戏结束条件中。,0,1,55
